# VM deploy — pull pre-built images from GHCR (no hot reload)
# Local development with hot reload: deploy/docker-compose.local.yml
#
# PostgreSQL: self-hosted container from deploy/docker-compose.db.yml, shared
# with the main stack over the external `fairterms-db-net` network. Start it
# first:  docker compose -f deploy/docker-compose.db.yml up -d
# DATABASE_URL in .env.dev should use 127.0.0.1:5432 — the frontend entrypoint
# rewrites the host to `postgres` inside the Docker network. Database: fairterms_dev.
#
# Same VM as main: host ports 8000/3000 (main uses 8001/3001)
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d

name: fairterms-dev

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/anhtrinh2905/fairterms/backend-dev
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      # RAG index is baked into the image (see src/backend/Dockerfile). Do NOT
      # mount a named volume over /app/.chroma — it would shadow the baked index
      # with a stale/empty one and reintroduce the wrong-citation bug.
      - logs-dev:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  frontend:
    image: ghcr.io/anhtrinh2905/fairterms/frontend-dev
    env_file:
      - .env.dev
    environment:
      # Internal backend URL for server-side fetches from frontend container.
      # ADMIN_EMAILS / ADMIN_API_TOKEN come from env_file (.env.dev) — do not
      # re-declare here: ${ADMIN_EMAILS:-} would interpolate from host/shell and
      # override .env.dev with an empty value on the VM.
      BACKEND_URL_INTERNAL: http://backend:8000
    ports:
      - "3000:3000"
    # Joins the shared DB network to reach Postgres as `postgres:5432`.
    networks:
      - default
      - fairterms-db-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  logs-dev:

networks:
  # Provided by deploy/docker-compose.db.yml — start that stack first.
  fairterms-db-net:
    external: true
