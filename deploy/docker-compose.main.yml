# Production stack — pull from GHCR
# Same VM as dev: host ports 8001/3001 (dev uses 8000/3000)
#
# PostgreSQL: Cloud SQL Auth Proxy — see docker-compose.dev.yml for notes.
# Usage: docker compose -f deploy/docker-compose.main.yml up -d

name: fairterms-main

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
    restart: unless-stopped
    command:
      - ${CLOUD_SQL_INSTANCE:-contract-analysis-g145-vinuni:asia-southeast1:fairterms-db}
      - --address=0.0.0.0
      - --port=5432

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/anhtrinh2905/fairterms/backend-main
    env_file:
      - .env.main
    ports:
      - "8001:8000"
    volumes:
      # RAG index is baked into the image (see src/backend/Dockerfile). Do NOT
      # mount a named volume over /app/.chroma — it would shadow the baked index
      # with a stale/empty one and reintroduce the wrong-citation bug.
      - logs-main:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  frontend:
    image: ghcr.io/anhtrinh2905/fairterms/frontend-main
    env_file:
      - .env.main
    environment:
      # Internal backend URL for server-side fetches from frontend container.
      # ADMIN_EMAILS / ADMIN_API_TOKEN / NEXT_PUBLIC_MOCK_ADMIN: from env_file (.env.main).
      BACKEND_URL_INTERNAL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  logs-main:
