# Local development — hot reload + self-hosted Postgres (fully offline, no GCP)
#
# =============================================================================
# ONE-TIME SETUP
# =============================================================================
#
# 1. Environment
#      cp .env.example .env
#    Fill API keys, AUTH_*, and DATABASE_URL (see step 2).
#
# 2. DATABASE_URL in repo root `.env`
#    Point at the local `postgres` container. Use 127.0.0.1 — the frontend
#    entrypoint rewrites the host to `postgres` inside the Docker network.
#    Credentials must match POSTGRES_USER / POSTGRES_PASSWORD below
#    (defaults: fairterms / fairterms). URL-encode special characters.
#
#      DATABASE_URL="postgresql://fairterms:fairterms@127.0.0.1:5432/fairterms?schema=public"
#
#    Optional overrides in `.env`: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
#
# =============================================================================
# OPTION A — Docker Compose (this file)
# =============================================================================
#
# From repo root:
#   docker compose -f deploy/docker-compose.local.yml up --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8010  (API docs: /docs)
#
# The `postgres` service stores data in the `pgdata` volume. The frontend
# entrypoint waits for it, runs `prisma migrate deploy`, then starts dev server.
#
# =============================================================================
# OPTION B — Native (no Docker)
# =============================================================================
#
# Terminal 1 — Postgres
#   Run just the DB container, or use a native install on 127.0.0.1:5432.
#     docker compose -f deploy/docker-compose.local.yml up -d postgres
#
# Terminal 2 — Backend
#     cd src/backend && uv sync --group dev
#     uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 8010
#
# Terminal 3 — Frontend
#     cd src/frontend && npm install
#     npx prisma migrate deploy && npm run dev
#
# =============================================================================
# VM deploy (pre-built GHCR images, no hot reload):
#   deploy/docker-compose.dev.yml

name: fairterms-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairterms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairterms}
      POSTGRES_DB: ${POSTGRES_DB:-fairterms}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairterms}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile.dev
    env_file:
      - ../.env
    environment:
      CHROMA_PERSIST_DIR: /app/.chroma
      LOG_DIR: /app/logs
      HF_HOME: /app/.cache/huggingface
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8010"
    volumes:
      - ../src/backend/app:/app/app:cached
      - ../outputs:/app/outputs
      - ../.env:/app/.env:ro
      - chroma_data:/app/.chroma
      - backend_logs:/app/logs
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ../.env
    environment:
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8010
      BACKEND_URL_INTERNAL: http://backend:8010
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # ADMIN_EMAILS, ADMIN_API_TOKEN, NEXT_PUBLIC_MOCK_ADMIN: from env_file (../.env).
      # Do not re-declare here — environment: overrides env_file and ${VAR:-} uses
      # compose/shell context, not ../.env, which can wipe the whitelist on deploy.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:cached
      - frontend_node_modules:/workspace/src/frontend/node_modules
      - frontend_next_cache:/workspace/src/frontend/.next
      - /workspace/src/frontend/app/generated
    working_dir: /workspace/src/frontend
    command:
      - sh
      - -c
      - |
        set -e
        export DATABASE_URL=$$(echo "$$DATABASE_URL" | sed -E -e 's/@(127\.0\.0\.1|localhost|172\.17\.0\.1):[0-9]+/@postgres:5432/')
        until nc -z postgres 5432; do
          echo "Waiting for Postgres..."
          sleep 2
        done
        npx prisma generate
        npx prisma migrate deploy
        exec npm run dev -- -H 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
  backend_logs:
  frontend_node_modules:
  frontend_next_cache:
  huggingface_cache:
