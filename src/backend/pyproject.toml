[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Agent + RAG"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.106.0",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "google-genai>=2.8.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.1",
    "langchain-openai>=0.3.0",
    "pillow>=10.0.0",
    "pymupdf>=1.27.2.3",
    "openai>=2.41.1",
    "pydantic-settings>=2.14.1",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml",
    "rank-bm25>=0.2.2",
    "langsmith>=0.3.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.49.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.16",
    "tqdm>=4.68.1",
]

# Personal project: resolve everything from public PyPI, not any work registry.
# NOTE: an ambient UV_INDEX env var still takes priority over this (env > config),
# so also clear UV_INDEX/PIP_EXTRA_INDEX_URL when running uv here (see README).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
