# Push to dev → build *-dev images → push GHCR → deploy on VM
#
# Domain: c2-app-145.io.vn
# Required GitHub Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEV_ENV_FILE

name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  DOMAIN: c2-app-145.io.vn
  DEPLOY_DIR: ~/fairterms/deploy
  COMPOSE_FILE: docker-compose.dev.yml
  BACKEND_TAG: backend-dev
  FRONTEND_TAG: frontend-dev
  NEXT_PUBLIC_BACKEND_URL: https://api-dev.c2-app-145.io.vn
  HEALTH_BACKEND_PORT: 8000
  HEALTH_FRONTEND_PORT: 3000

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Backend tests
        working-directory: src/backend
        run: |
          uv sync --frozen
          uv run pytest

      - name: Frontend lint
        working-directory: src/frontend
        run: |
          npm ci
          npm run lint

  build-push-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/backend
          push: true
          tags: ghcr.io/anhtrinh2905/fairterms/backend-dev
          # Bakes the RAG index at build time (Dockerfile runs scripts/ingest.py).
          # embed_key must be an OpenAI key valid for text-embedding-3-large.
          secrets: |
            embed_key=${{ secrets.EMBEDDING_OPENAI_API_KEY }}

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/frontend
          push: true
          tags: ghcr.io/anhtrinh2905/fairterms/frontend-dev
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ env.NEXT_PUBLIC_BACKEND_URL }}

      - name: Upload deploy files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.dev.yml,deploy/docker-compose.db.yml,deploy/postgres-init/01-create-databases.sh,deploy/backup-postgres.sh,deploy/migrate-cloudsql-to-local.sh,deploy/nginx/fairterms.conf,deploy/patch-nginx-upload-limits.sh,deploy/setup-server.sh,deploy/setup-ssl.sh
          target: ~/fairterms/deploy/
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          DB_ENV_FILE: ${{ secrets.DB_ENV_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DEV_ENV_FILE,DB_ENV_FILE,GHCR_TOKEN
          script: |
            set -euo pipefail
            mkdir -p ${{ env.DEPLOY_DIR }}/nginx
            cd ${{ env.DEPLOY_DIR }}
            printf '%s\n' "$DEV_ENV_FILE" > .env.dev
            printf '%s\n' "$DB_ENV_FILE" > .env.db
            chmod +x postgres-init/*.sh backup-postgres.sh migrate-cloudsql-to-local.sh 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            echo "==> Starting shared Postgres (docker-compose.db.yml)..."
            docker compose -f docker-compose.db.yml up -d
            echo "==> Pulling backend..."
            docker compose -f ${{ env.COMPOSE_FILE }} pull backend
            echo "==> Pulling frontend..."
            docker compose -f ${{ env.COMPOSE_FILE }} pull frontend
            echo "==> Cleaning up existing backend & frontend containers to avoid conflicts..."
            backend_containers=$(docker ps -aq --filter name=fairterms-dev-backend)
            if [ -n "$backend_containers" ]; then
              docker rm -f $backend_containers || true
            fi
            frontend_containers=$(docker ps -aq --filter name=fairterms-dev-frontend)
            if [ -n "$frontend_containers" ]; then
              docker rm -f $frontend_containers || true
            fi
            echo "==> Starting containers..."
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
            docker image prune -f
            # Only install the base HTTP nginx config the first time. Once certbot
            # has rewritten it with the HTTPS (443) blocks, never overwrite it —
            # otherwise every deploy would wipe SSL and the site drops to HTTP.
            if command -v nginx >/dev/null 2>&1 && [ -f nginx/fairterms.conf ]; then
              if [ ! -f /etc/nginx/sites-available/fairterms ]; then
                sudo cp nginx/fairterms.conf /etc/nginx/sites-available/fairterms
                sudo ln -sf /etc/nginx/sites-available/fairterms /etc/nginx/sites-enabled/fairterms
                sudo rm -f /etc/nginx/sites-enabled/default
              fi
              sudo nginx -t && sudo systemctl reload nginx
            fi
            if command -v nginx >/dev/null 2>&1 && [ -f patch-nginx-upload-limits.sh ]; then
              sudo bash patch-nginx-upload-limits.sh
            fi

      - name: Health check
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            BACKEND_PORT=${{ env.HEALTH_BACKEND_PORT }}
            FRONTEND_PORT=${{ env.HEALTH_FRONTEND_PORT }}
            ready=0
            for i in $(seq 1 90); do
              if curl -sf "http://127.0.0.1:${BACKEND_PORT}/health" >/dev/null; then
                ready=1
                echo "Backend healthy after ${i} attempt(s)"
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "==> Backend not ready after 180s"
              docker compose -f ${{ env.COMPOSE_FILE }} ps || true
              docker compose -f ${{ env.COMPOSE_FILE }} logs backend --tail 100 || true
              exit 1
            fi
            curl -sf "http://127.0.0.1:${BACKEND_PORT}/health"
            echo "==> Waiting for frontend..."
            ready=0
            for i in $(seq 1 90); do
              if curl -sfI "http://127.0.0.1:${FRONTEND_PORT}/" >/dev/null 2>&1; then
                ready=1
                echo "Frontend healthy after ${i} attempt(s)"
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "==> Frontend not ready after 180s"
              docker compose -f ${{ env.COMPOSE_FILE }} ps || true
              docker compose -f ${{ env.COMPOSE_FILE }} logs frontend --tail 100 || true
              docker compose -f docker-compose.db.yml logs postgres --tail 50 || true
              exit 1
            fi
            curl -sfI "http://127.0.0.1:${FRONTEND_PORT}/" | head -1
